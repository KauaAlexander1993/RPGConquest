services:
  - type: web
    name: kaua-alexander-rpgconquest
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rpgconquest-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: rpgconquest-db
    databaseName: rpgconquest
    user: rpgconquest
    plan: free